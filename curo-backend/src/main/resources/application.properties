spring.application.name=curo-backend
server.port=${PORT:8080}

spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DATABASE:curo}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

patient-service.api-key=${PATIENT_SERVICE_API_KEY:}

spring.data.mongodb.auto-index-creation=true

# Licence checks for DOCTOR and PHARMACY signup. mock = invented licence_registry collection, seeded on startup.
# Any other value has no implementation yet and the app will not start.
licence.verification.mode=${LICENCE_VERIFICATION_MODE:mock}
licence.verification.seed-on-startup=true

# Access grants (patient consent). Share codes are six digits, single use.
access.share-code.valid-minutes=15
access.share-code.max-failed-attempts=5
access.share-code.attempt-window-minutes=15
pharmacy.lookup.max-failed-lookups=10
pharmacy.lookup.window-minutes=15
access.grant.default-hours=24
access.grant.max-hours=720

# drug_master is filled with a built-in list on startup; a failure only logs a warning
drugs.seed-on-startup=true

# Interaction and allergy check. table = the built-in tables. A Bedrock-backed checker would add its own mode value.
interaction.check.mode=table

# Zone used to work out which day a prescription starts and ends
app.time-zone=Asia/Kolkata

# Dose tracking
# Minutes after a dose is due before it counts as missed. Set MISSED_GRACE_MINUTES to change it.
doses.missed-grace-minutes=${MISSED_GRACE_MINUTES:30}
doses.ongoing-horizon-days=30
# Shared secret the EventBridge rule sends in X-Internal-Key. Set it in the environment; empty means the endpoint refuses everyone.
internal.api-key=${INTERNAL_API_KEY:}

# Browser origins allowed to call the API, comma-separated exact origins (no wildcards). Set CORS_ALLOWED_ORIGINS in the environment.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# Fake demo world for development. Off unless DEMO_SEED=true. Never enable against real data.
demo.seed=${DEMO_SEED:false}
# Shared password for the demo accounts (published, fake). Override with DEMO_PASSWORD if you like.
demo.password=${DEMO_PASSWORD:DemoPass123!}

# Alerts. The reminder goes out this many minutes before a dose; the scheduler tick runs every 5, so it arrives 5 to 10 minutes before.
alerts.reminder-lead-minutes=10
# This many missed doses in a row (and every multiple) raises an ADHERENCE alert to the patient, caregivers and doctor.
alerts.escalation-consecutive-misses=3
# Amazon SNS topic for outside notifications. Leave unset to log them instead. Credentials come from the usual AWS environment/role, never from here.
alerts.sns.topic-arn=${ALERTS_SNS_TOPIC_ARN:}
aws.region=${AWS_REGION:}
